version: 0.2

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_TAG="amd64-build-${CODEBUILD_BUILD_NUMBER}"
  build:
    commands:
      - docker build --pull --platform linux/amd64 -f simulation/marine/croco/Dockerfile.batch -t "predsea-croco-base:$IMAGE_TAG" .
      - docker build --platform linux/amd64 -f simulation/marine/croco/Dockerfile.aws --build-arg "BASE_IMAGE=predsea-croco-base:$IMAGE_TAG" -t "$CROCO_REPOSITORY:$IMAGE_TAG" .
      - test "$(docker image inspect "$CROCO_REPOSITORY:$IMAGE_TAG" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
      - test "$(docker image inspect "$CROCO_REPOSITORY:$IMAGE_TAG" --format '{{json .Config.Entrypoint}}')" = '["python3","/app/scripts/run_marine_simulation.py"]'
      - >-
        docker run --rm --entrypoint python3 "$CROCO_REPOSITORY:$IMAGE_TAG"
        -c 'from scripts.run_marine_simulation import CROCO_MPI_RANKS; assert
        CROCO_MPI_RANKS == {"western_mediterranean_1km": 192}'
      - docker run --rm --entrypoint test "$CROCO_REPOSITORY:$IMAGE_TAG" -x /usr/local/bin/croco_western_mediterranean_1km
  post_build:
    commands:
      - docker push "$CROCO_REPOSITORY:$IMAGE_TAG"
      - printf '{"tag":"%s"}\n' "$IMAGE_TAG"
